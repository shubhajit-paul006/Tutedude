<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do Manager | Flask & MongoDB Atlas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="badge">Task 3: Parallel Development</span>
      <h1 class="title">Create To-Do Item</h1>
      <p class="subtitle">Add a new task to your DevOps pipeline</p>
    </div>

    {% if error %}
    <div class="alert-error" role="alert">
      <span>&#9888;</span>
      <div>{{ error }}</div>
    </div>
    {% endif %}

    <form action="{{ url_for('submit_todo_item') }}" method="POST">
      <div class="form-group">
        <label for="itemName">Item Name *</label>
        <input 
          type="text" 
          id="itemName" 
          name="itemName" 
          placeholder="e.g. Deploy Kubernetes Cluster" 
          required
        >
      </div>

      <div class="form-group">
        <label for="itemDescription">Item Description *</label>
        <textarea 
          id="itemDescription" 
          name="itemDescription" 
          rows="3" 
          placeholder="Detailed notes and requirements for the task..." 
          required
        ></textarea>
      </div>

      <button type="submit" class="btn-submit">Save To-Do Item</button>
    </form>

    <div class="nav-links">
      <a href="/">&larr; Back to Registration</a>
      <a href="/api" target="_blank">View JSON API (/api)</a>
    </div>
  </div>
</body>
</html>
