version: '3.8'

services:
  # Flask REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: shubhajitpaul006/devops-backend:latest
    container_name: devops-flask-backend
    restart: unless-stopped
    ports:
      - 5000:5000
    environment:
      - PORT=5000
      - DEBUG=False
      - MONGO_URI=mongodb+srv://<username>:<password>@cluster0.mongodb.net/devops_db?retryWrites=true&w=majority
      - DB_NAME=devops_db
      - COLLECTION_NAME=student_submissions
      - SECRET_KEY=tutedude-docker-devops-2026
    networks:
      - app-network

  # Node.js Express Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: shubhajitpaul006/devops-frontend:latest
    container_name: devops-node-frontend
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:5000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
